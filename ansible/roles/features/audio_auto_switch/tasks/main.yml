---
- name: Check for the PipeWire tools the headphone switcher needs
  shell: |
    set -u
    missing=""
    for tool in jq pw-dump pw-metadata pw-mon wpctl; do
      command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
    done
    if [ -n "$missing" ]; then
      echo "audio_auto_switch needs these commands on PATH:$missing (install jq, the PipeWire tools and WirePlumber)" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - dotfiles_platform.system == 'Linux'
    - not (dotfiles_ci | default(false))

- name: Record skipped headphone switcher
  set_fact:
    dotfiles_setup_skipped: >-
      {{
        (dotfiles_setup_skipped | default([])) + [
          {
            'phase': 'feature',
            'name': 'audio_auto_switch',
            'detail': 'The headphone switcher is a PipeWire user service, so it only applies on Linux.'
          }
        ]
      }}
  when: dotfiles_platform.system != 'Linux'
