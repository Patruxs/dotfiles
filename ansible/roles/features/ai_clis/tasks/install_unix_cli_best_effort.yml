---
- name: Install AI CLI (strict) {{ ai_cli.key }}
  include_tasks: unix.yml
  when: dotfiles_setup_mode | default('best_effort') == 'strict'

- name: Install AI CLI (best effort) {{ ai_cli.key }}
  when: dotfiles_setup_mode | default('best_effort') == 'best_effort'
  block:
    - name: Run the AI CLI installer {{ ai_cli.key }}
      include_tasks: unix.yml
  rescue:
    - name: Record AI CLI installer failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            (dotfiles_setup_failures | default([])) + [
              {
                'phase': 'ai_cli',
                'name': ai_cli.key,
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg | default(ansible_failed_result | to_json))
              }
            ]
          }}
