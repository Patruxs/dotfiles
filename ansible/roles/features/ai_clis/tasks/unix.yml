---
- name: Install or update {{ ai_cli.key }}
  shell: |
    set -eo pipefail
    dotfiles_digest() {
      if command -v sha256sum >/dev/null 2>&1; then
        sha256sum "$1" 2>/dev/null || true
      else
        shasum -a 256 "$1" 2>/dev/null || true
      fi
    }
    dotfiles_fingerprint() {
      local resolved dir
      resolved="$(command -v {{ ai_cli.value.command | quote }} 2>/dev/null || true)"
      [ -n "$resolved" ] || return 0
      resolved="$(readlink -f "$resolved" 2>/dev/null || printf '%s' "$resolved")"
      dotfiles_digest "$resolved"
      dir="$(dirname "$resolved")"
      for _ in 1 2 3 4; do
        if [ -f "$dir/package.json" ]; then
          dotfiles_digest "$dir/package.json"
          break
        fi
        dir="$(dirname "$dir")"
      done
    }
    dotfiles_before="$(dotfiles_fingerprint)"
    {{ ai_cli.value.install.unix }}
    dotfiles_after="$(dotfiles_fingerprint)"
    if [ "$dotfiles_before" != "$dotfiles_after" ]; then
      echo DOTFILES_CHANGED
    fi
  args:
    executable: /bin/bash
  environment: >-
    {{
      {
        'NPM_CONFIG_PREFIX': lookup('env', 'HOME') ~ '/.local',
        'NPM_CONFIG_FUND': 'false',
        'NPM_CONFIG_AUDIT': 'false',
        'PATH': lookup('env', 'HOME') ~ '/.local/bin:' ~ lookup('env', 'PATH')
      } |
      combine(
        {
          'NPM_CONFIG_JOBS': '1',
          'NODE_OPTIONS': '--max-old-space-size=512',
          'MAKEFLAGS': '-j1',
          'CARGO_BUILD_JOBS': '1'
        }
        if dotfiles_low_memory_setup | default(false) | bool
        else {}
      ) |
      combine({'CODEX_NON_INTERACTIVE': '1'} if dotfiles_automation | default(false) | bool else {})
    }}
  register: dotfiles_ai_cli_install
  changed_when: "'DOTFILES_CHANGED' in dotfiles_ai_cli_install.stdout_lines"
  when:
    - ai_cli.value.install.unix is defined
