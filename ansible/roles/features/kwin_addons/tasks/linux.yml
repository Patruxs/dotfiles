---
- name: Check for the KDE package tool
  command:
    argv:
      - sh
      - -c
      - command -v kpackagetool6 || command -v kpackagetool5
  register: kwin_addons_package_tool
  failed_when: false
  changed_when: false

- name: Fail when KWin add-ons cannot be installed on this machine
  fail:
    msg: "kwin_addons is selected but neither kpackagetool6 nor kpackagetool5 is installed; install the KDE package tools (kpackage) or drop kwin_addons from the profile."
  when: kwin_addons_package_tool.rc != 0

- name: Check whether the KWin add-ons already match upstream
  command:
    argv:
      - "{{ chezmoi_dir }}/scripts/kwin-addons-install.sh"
      - check
  register: kwin_addons_check
  failed_when: false
  changed_when: false

- name: Install or update the KWin add-ons
  command:
    argv:
      - "{{ chezmoi_dir }}/scripts/kwin-addons-install.sh"
      - install
  register: kwin_addons_install
  changed_when: true
  when: kwin_addons_check.rc != 0

- name: Report the KWin add-on install
  debug:
    var: kwin_addons_install.stdout_lines
  when: kwin_addons_install is not skipped
