---
- name: Install the Klassy theme on KDE Plasma
  ansible.builtin.include_tasks: linux.yml
  when:
    - dotfiles_platform.system == 'Linux'
    - dotfiles_desktop | default('none') == 'kde'
    - not (dotfiles_ci | default(false))

- name: Record skipped Klassy theme
  ansible.builtin.set_fact:
    dotfiles_setup_skipped: >-
      {{
        (dotfiles_setup_skipped | default([])) + [
          {
            'phase': 'feature',
            'name': 'klassy_theme',
            'detail': 'Klassy is a KDE Plasma theme, but '
                      ~ (dotfiles_desktop_detail | default('no desktop session')) ~ ' was detected.'
                      ~ ' Set DOTFILES_DESKTOP=kde to choose it explicitly.'
          }
        ]
      }}
  when:
    - dotfiles_platform.system == 'Linux'
    - dotfiles_desktop | default('none') != 'kde'
    - not (dotfiles_ci | default(false))
