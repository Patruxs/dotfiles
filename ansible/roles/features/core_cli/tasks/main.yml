---
- name: Install lazygit from the upstream release where no package carries it
  include_tasks: linux-lazygit.yml
  when:
    - dotfiles_platform.system == 'Linux'
    - dotfiles_platform.distro_key in ['debian', 'fedora']
    - not (dotfiles_ci | default(false))

- name: Ensure the user binary directory exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: "0755"
  when: dotfiles_platform.name == 'ubuntu'

- name: Expose Debian-renamed core CLI binaries under their upstream names
  file:
    src: "/usr/bin/{{ item.debian }}"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/{{ item.upstream }}"
    state: link
  loop:
    - { debian: batcat, upstream: bat }
    - { debian: fdfind, upstream: fd }
  loop_control:
    label: "{{ item.upstream }}"
  when:
    - dotfiles_platform.name == 'ubuntu'
    - not (dotfiles_ci | default(false))
