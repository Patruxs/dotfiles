---
- name: Install VirtualBox on Linux
  include_tasks: linux.yml
  when:
    - dotfiles_platform.system == 'Linux'
    - not (dotfiles_omarchy | default(false) | bool)
    - not (dotfiles_ci | default(false))

- name: Record VirtualBox skipped on Omarchy
  set_fact:
    dotfiles_setup_skipped: >-
      {{
        (dotfiles_setup_skipped | default([])) + [
          {
            'phase': 'feature',
            'name': 'virtualbox',
            'detail': 'Omarchy runs its own kernel, for which Arch publishes no virtualbox-host-modules-arch package. Install virtualbox together with virtualbox-host-dkms by hand if you need it.'
          }
        ]
      }}
  when:
    - dotfiles_platform.system == 'Linux'
    - dotfiles_omarchy | default(false) | bool
    - not (dotfiles_ci | default(false))
