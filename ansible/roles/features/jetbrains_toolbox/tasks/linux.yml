---
- name: Install or update JetBrains Toolbox (Linux)
  shell: |
    dotfiles_fingerprint() {
      sha256sum ~/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox 2>/dev/null || true
    }
    dotfiles_before="$(dotfiles_fingerprint)"
    URL=$(curl -s 'https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release' | grep -oP '"linux":\{.*?"link":"\K[^"]+')
    if [ -z "$URL" ]; then
      exit 1
    fi
    mkdir -p ~/.local/share/JetBrains/Toolbox/bin
    cd /tmp
    rm -f jetbrains-toolbox-*.tar.gz
    rm -rf jetbrains-toolbox-*
    curl -fsSLO "$URL"
    tar -xzf jetbrains-toolbox-*.tar.gz
    mv jetbrains-toolbox-*/jetbrains-toolbox ~/.local/share/JetBrains/Toolbox/bin/
    rm -f jetbrains-toolbox-*.tar.gz
    rm -rf jetbrains-toolbox-*
    dotfiles_after="$(dotfiles_fingerprint)"
    if [ "$dotfiles_before" != "$dotfiles_after" ]; then
      echo DOTFILES_CHANGED
    fi
  args:
    executable: /bin/bash
  register: dotfiles_jetbrains_toolbox_install
  changed_when: "'DOTFILES_CHANGED' in dotfiles_jetbrains_toolbox_install.stdout_lines"
