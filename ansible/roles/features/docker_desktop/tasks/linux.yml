---
- name: Resolve the latest Docker Desktop release and build for Linux
  ansible.builtin.shell: |
    set -euo pipefail
    appcast="$(curl -fsSL https://desktop.docker.com/linux/main/amd64/appcast.xml)"
    version="$(printf '%s' "$appcast" | grep -oE 'sparkle:shortVersionString="[^"]+"' | awk 'NR == 1' | cut -d'"' -f2)"
    build="$(printf '%s' "$appcast" | grep -oE 'sparkle:version="[^"]+"' | awk 'NR == 1' | cut -d'"' -f2)"
    printf '%s %s\n' "$version" "$build"
  args:
    executable: /bin/bash
  register: dotfiles_docker_desktop_latest
  changed_when: false
  failed_when: false
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']
    - dotfiles_platform.architecture in ['x86_64', 'amd64']

- name: Check whether Docker Desktop is already installed (Debian)
  ansible.builtin.command: dpkg-query -W -f '${db:Status-Status} ${Version}' docker-desktop
  register: dotfiles_docker_desktop_installed_debian
  changed_when: false
  failed_when: false
  when:
    - dotfiles_platform.distro_key == 'debian'

- name: Check whether Docker Desktop is already installed (Fedora)
  ansible.builtin.command: rpm -q docker-desktop --qf '%{VERSION}'
  register: dotfiles_docker_desktop_installed_fedora
  changed_when: false
  failed_when: false
  when:
    - dotfiles_platform.distro_key == 'fedora'

- name: Check whether Docker Desktop is already installed (Arch)
  ansible.builtin.command: pacman -Q docker-desktop
  register: dotfiles_docker_desktop_installed_arch
  changed_when: false
  failed_when: false
  when:
    - dotfiles_platform.distro_key == 'arch'

- name: Decide whether Docker Desktop needs installing or updating
  vars:
    docker_desktop_installed_output: >-
      {{
        (dotfiles_docker_desktop_installed_debian.stdout | default(''))
        if (dotfiles_platform.distro_key == 'debian' and (dotfiles_docker_desktop_installed_debian.stdout | default('')).startswith('installed '))
        else (dotfiles_docker_desktop_installed_fedora.stdout | default(''))
        if (dotfiles_platform.distro_key == 'fedora' and (dotfiles_docker_desktop_installed_fedora.rc | default(1)) == 0)
        else (dotfiles_docker_desktop_installed_arch.stdout | default(''))
        if (dotfiles_platform.distro_key == 'arch' and (dotfiles_docker_desktop_installed_arch.rc | default(1)) == 0)
        else ''
      }}
  set_fact:
    dotfiles_docker_desktop_installed_version: >-
      {{ docker_desktop_installed_output | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true) }}
    dotfiles_docker_desktop_latest_version: >-
      {{ dotfiles_docker_desktop_latest.stdout | default('') | trim | regex_findall('^([0-9]+\.[0-9]+\.[0-9]+) [0-9]+$') | first | default('', true) }}
    dotfiles_docker_desktop_latest_build: >-
      {{ dotfiles_docker_desktop_latest.stdout | default('') | trim | regex_findall('^[0-9]+\.[0-9]+\.[0-9]+ ([0-9]+)$') | first | default('', true) }}
    dotfiles_docker_desktop_package_file: >-
      {{
        {
          'debian': 'docker-desktop-amd64.deb',
          'fedora': 'docker-desktop-x86_64.rpm',
          'arch': 'docker-desktop-x86_64.pkg.tar.zst'
        }[dotfiles_platform.distro_key]
      }}
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']

- name: Record whether Docker Desktop needs installing or updating
  set_fact:
    dotfiles_docker_desktop_install_needed: >-
      {{
        dotfiles_docker_desktop_installed_version | default('') == ''
        or (
          dotfiles_docker_desktop_latest_version | default('') != ''
          and dotfiles_docker_desktop_installed_version != dotfiles_docker_desktop_latest_version
        )
      }}
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']

- name: Resolve the published SHA-256 checksum of the Docker Desktop package
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL {{ ('https://desktop.docker.com/linux/main/amd64/' ~ dotfiles_docker_desktop_latest_build ~ '/checksums.txt') | quote }} \
      | awk -v file={{ dotfiles_docker_desktop_package_file | quote }} '$2 == "*" file { print $1 }'
  args:
    executable: /bin/bash
  register: dotfiles_docker_desktop_checksum
  changed_when: false
  failed_when: false
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']
    - dotfiles_docker_desktop_install_needed | default(false) | bool
    - dotfiles_docker_desktop_latest_build | default('') != ''

- name: Record the Docker Desktop package download URL and checksum
  ansible.builtin.set_fact:
    dotfiles_docker_desktop_package_url: >-
      https://desktop.docker.com/linux/main/amd64/{{ dotfiles_docker_desktop_latest_build }}/{{ dotfiles_docker_desktop_package_file }}
    dotfiles_docker_desktop_package_sha256: >-
      {{ dotfiles_docker_desktop_checksum.stdout | default('') | trim | regex_search('^[0-9a-f]{64}$') | default('', true) }}
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']
    - dotfiles_docker_desktop_install_needed | default(false) | bool

- name: Fail when the Docker Desktop package cannot be verified
  ansible.builtin.fail:
    msg: >-
      Refusing to install Docker Desktop without a published checksum:
      the latest build could not be resolved from the appcast or checksums.txt
      did not list {{ dotfiles_docker_desktop_package_file | default('the package') }}
      (build {{ dotfiles_docker_desktop_latest_build | default('unknown') }}).
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']
    - dotfiles_docker_desktop_install_needed | default(false) | bool
    - dotfiles_docker_desktop_package_sha256 | default('') == ''

- name: Report when the latest Docker Desktop release could not be resolved
  debug:
    msg: >-
      Could not read the Docker Desktop appcast, so the installed version
      ({{ dotfiles_docker_desktop_installed_version }}) was left as is.
  when:
    - dotfiles_platform.distro_key in ['debian', 'fedora', 'arch']
    - dotfiles_docker_desktop_installed_version | default('') != ''
    - dotfiles_docker_desktop_latest_version | default('') == ''

- name: Install or update Docker Desktop on Debian-based Distros
  vars:
    docker_ubuntu_release: "{{ dotfiles_platform.ubuntu_codename }}"
  when:
    - dotfiles_platform.distro_key == 'debian'
    - dotfiles_platform.ubuntu_codename in dotfiles_docker_desktop_ubuntu_codenames
    - dotfiles_platform.architecture in ['x86_64', 'amd64']
    - dotfiles_docker_desktop_install_needed | default(false) | bool
  block:
    - name: Create temporary directory for Docker Desktop Debian package
      tempfile:
        state: directory
        prefix: docker-desktop-
      register: docker_desktop_tmpdir_debian
      changed_when: false

    - name: Download Docker Desktop Debian package
      get_url:
        url: "{{ dotfiles_docker_desktop_package_url }}"
        dest: "{{ docker_desktop_tmpdir_debian.path }}/docker-desktop-amd64.deb"
        checksum: "sha256:{{ dotfiles_docker_desktop_package_sha256 }}"
        mode: "0644"
      changed_when: false

    - name: Install Docker Desktop Debian package
      ansible.builtin.shell: |
        set -euo pipefail
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod 0644 /etc/apt/keyrings/docker.asc
        cat >/etc/apt/sources.list.d/docker.sources <<'DOCKER_SOURCES'
        Types: deb
        URIs: https://download.docker.com/linux/ubuntu
        Suites: {{ docker_ubuntu_release }}
        Components: stable
        Architectures: {{ 'amd64' if dotfiles_platform.architecture in ['x86_64', 'amd64'] else 'arm64' }}
        Signed-By: /etc/apt/keyrings/docker.asc
        DOCKER_SOURCES
        apt-get update
        apt-get install -y docker-ce-cli pass desktop-file-utils qemu-system-x86 uidmap
        apt-get install -y {{ docker_desktop_tmpdir_debian.path | quote }}/docker-desktop-amd64.deb
      become: true
      args:
        executable: /bin/bash
  always:
    - name: Remove temporary Docker Desktop Debian package directory
      file:
        path: "{{ docker_desktop_tmpdir_debian.path }}"
        state: absent
      changed_when: false
      when: docker_desktop_tmpdir_debian is defined and docker_desktop_tmpdir_debian.path is defined

- name: Install or update Docker Desktop on Fedora
  when:
    - dotfiles_platform.distro_key == 'fedora'
    - (dotfiles_platform.distribution_major_version | int) in dotfiles_docker_desktop_fedora_releases
    - dotfiles_platform.architecture in ['x86_64', 'amd64']
    - dotfiles_docker_desktop_install_needed | default(false) | bool
  block:
    - name: Create temporary directory for Docker Desktop Fedora package
      tempfile:
        state: directory
        prefix: docker-desktop-
      register: docker_desktop_tmpdir_fedora
      changed_when: false

    - name: Download Docker Desktop Fedora package
      get_url:
        url: "{{ dotfiles_docker_desktop_package_url }}"
        dest: "{{ docker_desktop_tmpdir_fedora.path }}/docker-desktop-x86_64.rpm"
        checksum: "sha256:{{ dotfiles_docker_desktop_package_sha256 }}"
        mode: "0644"
      changed_when: false

    - name: Install Docker Desktop Fedora package
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://download.docker.com/linux/fedora/docker-ce.repo -o /etc/yum.repos.d/docker-ce.repo
        chmod 0644 /etc/yum.repos.d/docker-ce.repo
        dnf install -y docker-ce-cli pass desktop-file-utils gtk3-devel qemu-system-x86 shadow-utils
        dnf install -y --nogpgcheck {{ docker_desktop_tmpdir_fedora.path | quote }}/docker-desktop-x86_64.rpm
      become: true
      args:
        executable: /bin/bash
  always:
    - name: Remove temporary Docker Desktop Fedora package directory
      file:
        path: "{{ docker_desktop_tmpdir_fedora.path }}"
        state: absent
      changed_when: false
      when: docker_desktop_tmpdir_fedora is defined and docker_desktop_tmpdir_fedora.path is defined

- name: Install or update Docker Desktop on Arch Linux
  when:
    - dotfiles_platform.distro_key == 'arch'
    - dotfiles_platform.architecture in ['x86_64', 'amd64']
    - dotfiles_docker_desktop_install_needed | default(false) | bool
  block:
    - name: Create temporary directory for Docker Desktop Arch package
      tempfile:
        state: directory
        prefix: docker-desktop-
      register: docker_desktop_tmpdir_arch
      changed_when: false

    - name: Download Docker Desktop Arch package
      get_url:
        url: "{{ dotfiles_docker_desktop_package_url }}"
        dest: "{{ docker_desktop_tmpdir_arch.path }}/docker-desktop-x86_64.pkg.tar.zst"
        checksum: "sha256:{{ dotfiles_docker_desktop_package_sha256 }}"
        mode: "0644"
      changed_when: false

    - name: Install Docker Desktop Arch package
      ansible.builtin.shell: |
        set -euo pipefail
        pacman -S --noconfirm --needed curl qemu-desktop libseccomp libcap-ng pass desktop-file-utils gtk3 libx11 shadow
        pacman -U --noconfirm --needed {{ docker_desktop_tmpdir_arch.path | quote }}/docker-desktop-x86_64.pkg.tar.zst
      become: true
      args:
        executable: /bin/bash
  always:
    - name: Remove temporary Docker Desktop Arch package directory
      file:
        path: "{{ docker_desktop_tmpdir_arch.path }}"
        state: absent
      changed_when: false
      when: docker_desktop_tmpdir_arch is defined and docker_desktop_tmpdir_arch.path is defined
