---
- name: Install Docker Desktop on Linux
  include_tasks: linux.yml
  when:
    - dotfiles_platform.system == 'Linux'
    - not (dotfiles_omarchy | default(false) | bool)
    - not (dotfiles_ci | default(false))

- name: Record Docker Desktop skipped on Omarchy
  set_fact:
    dotfiles_setup_skipped: >-
      {{
        (dotfiles_setup_skipped | default([])) + [
          {
            'phase': 'feature',
            'name': 'docker_desktop',
            'detail': 'Omarchy already ships Docker Engine with the compose and buildx plugins, and the Docker Desktop package conflicts with them. Docker is managed by Omarchy on this machine.'
          }
        ]
      }}
  when:
    - dotfiles_platform.system == 'Linux'
    - dotfiles_omarchy | default(false) | bool
    - not (dotfiles_ci | default(false))
