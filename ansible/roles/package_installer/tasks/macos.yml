---
- name: Install or update Homebrew packages (macOS strict)
  community.general.homebrew:
    name: "{{ homebrew_brews }}"
    state: latest
    update_homebrew: true
  changed_when: false
  when:
    - homebrew_brews | length > 0
    - dotfiles_setup_mode | default('best_effort') == 'strict'

- name: Install or update Homebrew casks (macOS strict)
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    state: latest
    greedy: true
    update_homebrew: true
  changed_when: false
  when:
    - homebrew_casks | length > 0
    - dotfiles_setup_mode | default('best_effort') == 'strict'

- name: Install or update Homebrew packages (macOS best effort)
  community.general.homebrew:
    name: "{{ item }}"
    state: latest
    update_homebrew: true
  loop: "{{ homebrew_brews }}"
  loop_control:
    label: "{{ item }}"
  register: dotfiles_homebrew_brew_install_results
  changed_when: false
  ignore_errors: true
  when:
    - homebrew_brews | length > 0
    - dotfiles_setup_mode | default('best_effort') == 'best_effort'

- name: Record Homebrew package installation failures
  ansible.builtin.include_role:
    name: record_failure
  vars:
    failure_phase: brew_package
    failure_name: "{{ failed_install.item }}"
    failure_task: Install or update Homebrew packages (macOS best effort)
    failure_result: "{{ failed_install }}"
  loop: "{{ dotfiles_homebrew_brew_install_results.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    loop_var: failed_install
    label: "{{ failed_install.item }}"
  when: dotfiles_setup_mode | default('best_effort') == 'best_effort'

- name: Install or update Homebrew casks (macOS best effort)
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest
    greedy: true
    update_homebrew: true
  loop: "{{ homebrew_casks }}"
  loop_control:
    label: "{{ item }}"
  register: dotfiles_homebrew_cask_install_results
  changed_when: false
  ignore_errors: true
  when:
    - homebrew_casks | length > 0
    - dotfiles_setup_mode | default('best_effort') == 'best_effort'

- name: Record Homebrew cask installation failures
  ansible.builtin.include_role:
    name: record_failure
  vars:
    failure_phase: cask_package
    failure_name: "{{ failed_install.item }}"
    failure_task: Install or update Homebrew casks (macOS best effort)
    failure_result: "{{ failed_install }}"
  loop: "{{ dotfiles_homebrew_cask_install_results.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    loop_var: failed_install
    label: "{{ failed_install.item }}"
  when: dotfiles_setup_mode | default('best_effort') == 'best_effort'
