---
- name: Refresh the package index
  ansible.builtin.command:
    argv: "{{ dotfiles_platform.package_index_refresh_command }}"
  become: true
  register: dotfiles_package_index_refresh
  changed_when: false
  failed_when: false
  when: dotfiles_platform.package_index_refresh_command | length > 0

- name: Record a package index refresh failure
  ansible.builtin.include_role:
    name: record_failure
  vars:
    failure_phase: "{{ dotfiles_platform.package_family }}_package"
    failure_name: package index refresh
    failure_task: Refresh the package index
    failure_result: "{{ dotfiles_package_index_refresh }}"
  when: (dotfiles_package_index_refresh.rc | default(0)) != 0

# pacman -T prints the names no installed package provides and exits 127 when
# there are any. A name another installed package already provides (Omarchy
# ships mise-bin for mise and ttf-jetbrains-mono-nerd-basic for
# ttf-jetbrains-mono-nerd) could only fail with a package conflict, so it is
# left alone.
- name: Find pacman packages no installed package provides
  ansible.builtin.command:
    argv: "{{ ['pacman', '-T'] + system_packages }}"
  register: dotfiles_pacman_unprovided
  changed_when: false
  failed_when: dotfiles_pacman_unprovided.rc not in [0, 127]
  when: dotfiles_platform.package_family == 'pacman'

- name: Record pacman packages an installed package already provides
  ansible.builtin.set_fact:
    dotfiles_setup_skipped: >-
      {{
        (dotfiles_setup_skipped | default([])) + [
          {
            'phase': 'pacman_package',
            'name': system_packages | difference(dotfiles_pacman_unprovided.stdout_lines) | join(', '),
            'detail': 'Already provided by an installed package, so pacman was not asked to install it.'
          }
        ]
      }}
  when:
    - dotfiles_platform.package_family == 'pacman'
    - system_packages | difference(dotfiles_pacman_unprovided.stdout_lines) | length > 0

- name: Keep only the pacman packages that still need installing
  ansible.builtin.set_fact:
    system_packages: "{{ system_packages | select('in', dotfiles_pacman_unprovided.stdout_lines) | list }}"
  when: dotfiles_platform.package_family == 'pacman'

- name: Install system packages
  ansible.builtin.command:
    argv: "{{ dotfiles_platform.package_install_command + system_packages }}"
  become: true
  register: dotfiles_system_packages_install
  changed_when: dotfiles_platform.package_install_noop_marker not in dotfiles_system_packages_install.stdout
  when:
    - system_packages | length > 0
    - dotfiles_setup_mode == 'strict'
    - not (dotfiles_low_memory_setup | default(false) | bool)

- name: Install system packages one at a time
  ansible.builtin.command:
    argv: "{{ dotfiles_platform.package_install_serial_command + [item] }}"
  become: true
  loop: "{{ system_packages }}"
  register: dotfiles_system_package_installs
  changed_when:
    - dotfiles_system_package_installs.rc == 0
    - dotfiles_platform.package_install_noop_marker not in dotfiles_system_package_installs.stdout
  failed_when:
    - dotfiles_setup_mode == 'strict'
    - dotfiles_system_package_installs.rc != 0
  when: dotfiles_setup_mode == 'best_effort' or (dotfiles_low_memory_setup | default(false) | bool)

- name: Record system package installation failures
  ansible.builtin.include_role:
    name: record_failure
  vars:
    failure_phase: "{{ dotfiles_platform.package_family }}_package"
    failure_name: "{{ failed_install.item }}"
    failure_task: Install system packages one at a time
    failure_result: "{{ failed_install }}"
  loop: "{{ dotfiles_system_package_installs.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    loop_var: failed_install
    label: "{{ failed_install.item }}"
