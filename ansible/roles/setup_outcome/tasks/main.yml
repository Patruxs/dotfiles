---
- name: Ensure setup outcome defaults exist
  set_fact:
    dotfiles_package_plan: >-
      {{
        dotfiles_package_plan | default({
          'installer': dotfiles_platform.package_family | default('unknown'),
          'selected_package_sets': [],
          'selected_system_packages': [],
          'system_packages': [],
          'excluded_system_packages': [],
          'homebrew_brews': [],
          'homebrew_casks': [],
          'flatpak_apps': []
        })
      }}
    dotfiles_setup_failures: "{{ dotfiles_setup_failures | default([]) }}"
    dotfiles_setup_configured: "{{ dotfiles_setup_configured | default([]) }}"
    dotfiles_setup_skipped: "{{ dotfiles_setup_skipped | default([]) }}"
    dotfiles_setup_aborted: "{{ dotfiles_setup_aborted | default(false) }}"
    dotfiles_setup_report_path: "{{ lookup('env', 'HOME') }}/.dotfiles_setup_report.md"
    dotfiles_bootstrap_outcomes_file: "{{ lookup('env', 'DOTFILES_BOOTSTRAP_OUTCOMES_FILE') | default('', true) }}"
    dotfiles_bootstrap_outcomes: []

# bootstrap.sh records the outcome of every prerequisite step it ran before
# Ansible (system refresh, curl, git, chezmoi, repository, Ansible itself) as
# JSON lines and hands the file over through DOTFILES_BOOTSTRAP_OUTCOMES_FILE,
# so the report covers the whole run and not only the playbook.
- name: Check for bootstrap step outcomes
  stat:
    path: "{{ dotfiles_bootstrap_outcomes_file }}"
  register: dotfiles_bootstrap_outcomes_stat
  when: dotfiles_bootstrap_outcomes_file | length > 0

- name: Load bootstrap step outcomes
  set_fact:
    dotfiles_bootstrap_outcomes: >-
      {{
        lookup('file', dotfiles_bootstrap_outcomes_file).splitlines()
        | select('match', '^\{')
        | map('from_json')
        | list
      }}
  when:
    - dotfiles_bootstrap_outcomes_stat is not skipped
    - dotfiles_bootstrap_outcomes_stat.stat.exists

- name: Convert bootstrap step outcomes into summary entries
  set_fact:
    dotfiles_bootstrap_failures: >-
      {{
        (dotfiles_bootstrap_failures | default([]))
        + ([{'phase': 'bootstrap', 'name': item.name, 'task': item.name, 'error': item.detail | default('')}] if item.status == 'failed' else [])
      }}
    dotfiles_bootstrap_configured: >-
      {{
        (dotfiles_bootstrap_configured | default([]))
        + ([{'phase': 'bootstrap', 'name': item.name, 'detail': 'Completed before Ansible started.'}] if item.status == 'ok' else [])
      }}
    dotfiles_bootstrap_skipped: >-
      {{
        (dotfiles_bootstrap_skipped | default([]))
        + ([{'phase': 'bootstrap', 'name': item.name, 'detail': item.detail | default('')}] if item.status == 'skipped' else [])
      }}
  loop: "{{ dotfiles_bootstrap_outcomes }}"
  loop_control:
    label: "{{ item.status | default('unknown') }} {{ item.name | default('unknown step') }}"

- name: Merge bootstrap step outcomes into the setup summary
  set_fact:
    dotfiles_setup_failures: "{{ (dotfiles_bootstrap_failures | default([])) + dotfiles_setup_failures }}"
    dotfiles_setup_configured: "{{ (dotfiles_bootstrap_configured | default([])) + dotfiles_setup_configured }}"
    dotfiles_setup_skipped: "{{ (dotfiles_bootstrap_skipped | default([])) + dotfiles_setup_skipped }}"
  when: dotfiles_bootstrap_outcomes | length > 0

- name: Load devtools data for outcome verification
  include_vars:
    file: "{{ chezmoi_dir }}/home/.chezmoidata/devtools.yaml"
    name: devtools_data
  when:
    - "'npm_global_tools' in (features | default([]))"
    - devtools_data is not defined

- name: Load AI CLI data for outcome verification
  include_vars:
    file: "{{ chezmoi_dir }}/home/.chezmoidata/ai-clis.yaml"
    name: ai_clis_data
  when:
    - "'ai_clis' in (features | default([]))"
    - ai_clis_data is not defined

- name: Record intentionally excluded system package entries
  set_fact:
    dotfiles_setup_skipped: >-
      {{
        dotfiles_setup_skipped
        + [
          {
            'phase': 'packages',
            'name': item,
            'detail': 'Selected system package entry was intentionally excluded for this environment or because another selected feature provides it.'
          }
        ]
      }}
  loop: "{{ dotfiles_package_plan.excluded_system_packages | default([]) }}"

- name: Verify selected apt package entries are present
  command:
    argv:
      - dpkg-query
      - -W
      - "{{ item }}"
  loop: "{{ dotfiles_package_plan.system_packages | default([]) }}"
  register: dotfiles_verified_apt_packages
  changed_when: false
  failed_when: false
  when: dotfiles_platform.package_family == 'apt'

- name: Verify selected dnf package entries are present
  command:
    argv:
      - rpm
      - -q
      - "{{ item }}"
  loop: "{{ dotfiles_package_plan.system_packages | default([]) }}"
  register: dotfiles_verified_dnf_packages
  changed_when: false
  failed_when: false
  when: dotfiles_platform.package_family == 'dnf'

- name: Verify selected pacman package entries are present
  command:
    argv:
      - pacman
      - -Q
      - "{{ item }}"
  loop: "{{ dotfiles_package_plan.system_packages | default([]) }}"
  register: dotfiles_verified_pacman_packages
  changed_when: false
  failed_when: false
  when: dotfiles_platform.package_family == 'pacman'

- name: Verify selected Homebrew formula entries are present
  command:
    argv:
      - brew
      - list
      - --formula
      - "{{ item }}"
  loop: "{{ dotfiles_package_plan.homebrew_brews | default([]) }}"
  register: dotfiles_verified_homebrew_brews
  changed_when: false
  failed_when: false
  when: dotfiles_package_plan.homebrew_brews | default([]) | length > 0

- name: Verify selected Homebrew cask entries are present
  command:
    argv:
      - brew
      - list
      - --cask
      - "{{ item }}"
  loop: "{{ dotfiles_package_plan.homebrew_casks | default([]) }}"
  register: dotfiles_verified_homebrew_casks
  changed_when: false
  failed_when: false
  when: dotfiles_package_plan.homebrew_casks | default([]) | length > 0

- name: Verify selected Flatpak app entries are present
  command:
    argv:
      - flatpak
      - info
      - "{{ item }}"
  loop: "{{ dotfiles_package_plan.flatpak_apps | default([]) }}"
  register: dotfiles_verified_flatpak_apps
  changed_when: false
  failed_when: false
  when: dotfiles_package_plan.flatpak_apps | default([]) | length > 0

- name: Verify selected npm global tools are present
  command:
    argv:
      - npm
      - list
      - --global
      - --depth=0
      - "{{ item }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ lookup('env', 'HOME') }}/.local"
  loop: "{{ (devtools_data | default({'devtools': {'npm_global_packages': []}})).devtools.npm_global_packages | default([]) }}"
  register: dotfiles_verified_npm_global_tools
  changed_when: false
  failed_when: false
  when:
    - "'npm_global_tools' in (features | default([]))"
    - devtools_data is defined

- name: Verify selected AI CLI commands are present
  shell: "command -v {{ item.value.command | quote }}"
  args:
    executable: /bin/bash
  loop: "{{ ((ai_clis_data | default({'ai_clis': {'clis': {}}})).ai_clis.clis | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: dotfiles_verified_ai_clis
  changed_when: false
  failed_when: false
  when:
    - "'ai_clis' in (features | default([]))"
    - ai_clis_data is defined
    - dotfiles_platform.system != 'Windows'

- name: Summarize the setup result
  vars:
    dotfiles_setup_abort_suffix: "{{ ' (strict mode stops at the first failure).' if dotfiles_setup_mode == 'strict' else '.' }}"
  set_fact:
    dotfiles_setup_result: >-
      {{
        ("Aborted at '" ~ (dotfiles_setup_failures | last).name ~ "'" ~ dotfiles_setup_abort_suffix)
        if dotfiles_setup_aborted | bool
        else ('Completed with ' ~ (dotfiles_setup_failures | length) ~ ' skipped failure(s).')
        if dotfiles_setup_failures | length > 0
        else 'Completed successfully.'
      }}
    dotfiles_setup_report_time: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S %Z\"') }}"

- name: Prepare setup outcome report
  set_fact:
    dotfiles_setup_report_text: |
      # Dotfiles setup report

      - Date: {{ dotfiles_setup_report_time }}
      - Profile: `{{ profile }}`
      - Platform: `{{ dotfiles_platform.name }}` ({{ dotfiles_platform.package_family }})
      - Mode: `{{ dotfiles_setup_mode }}`
      - Result: {{ dotfiles_setup_result }}

      ## Errors{{ '' if dotfiles_setup_aborted | bool else ' (skipped, setup continued)' }}

      {% if dotfiles_setup_failures | length == 0 %}
      No errors were recorded.

      {% else %}
      {% for failure in dotfiles_setup_failures %}
      ### {{ loop.index }}. [{{ failure.phase }}] {{ failure.name }}

      {% if failure.task is defined and failure.task != failure.name %}
      Task: {{ failure.task }}

      {% endif %}
      ````text
      {{ (failure.error | default('') | string | trim) or '(no error output was captured)' }}
      ````

      {% endfor %}
      {% endif %}
      ## Not detected after setup

      {% set undetected = namespace(count=0) %}
      {% for result in dotfiles_verified_apt_packages.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [apt] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_dnf_packages.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [dnf] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_pacman_packages.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [pacman] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_homebrew_brews.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [brew] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_homebrew_casks.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [cask] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_flatpak_apps.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [flatpak] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_npm_global_tools.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [npm global] `{{ result.item }}` was selected but was not detected after setup.
      {% endfor %}
      {% for result in dotfiles_verified_ai_clis.results | default([]) if result.rc is defined and result.rc != 0 %}
      {% set undetected.count = undetected.count + 1 %}
      - [ai cli] `{{ result.item.key }}` (`{{ result.item.value.command }}`) was selected but was not detected after setup.
      {% endfor %}
      {% if undetected.count == 0 %}
      Every selected entry with a local verification check was detected.
      {% endif %}

      ## Skipped intentionally

      {% if dotfiles_setup_skipped | length == 0 %}
      Nothing was skipped intentionally.
      {% else %}
      {% for skipped in dotfiles_setup_skipped %}
      - [{{ skipped.phase }}] {{ skipped.name }}: {{ skipped.detail }}
      {% endfor %}
      {% endif %}

      ## Installed or present after setup

      {% set detected = namespace(count=0) %}
      {% for result in dotfiles_verified_apt_packages.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [apt] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_dnf_packages.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [dnf] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_pacman_packages.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [pacman] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_homebrew_brews.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [brew] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_homebrew_casks.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [cask] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_flatpak_apps.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [flatpak] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_npm_global_tools.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [npm global] `{{ result.item }}`
      {% endfor %}
      {% for result in dotfiles_verified_ai_clis.results | default([]) if result.rc is defined and result.rc == 0 %}
      {% set detected.count = detected.count + 1 %}
      - [ai cli] `{{ result.item.key }}` (`{{ result.item.value.command }}`)
      {% endfor %}
      {% if detected.count == 0 %}
      No selected entries with a local verification check were detected.
      {% endif %}

      ## Completed steps

      {% if dotfiles_setup_configured | length == 0 %}
      - No setup steps completed.
      {% else %}
      {% for configured in dotfiles_setup_configured %}
      - [{{ configured.phase }}] {{ configured.name }}: {{ configured.detail }}
      {% endfor %}
      {% endif %}

      ## Next steps

      - Setup is safe to re-run. Fix the cause of any error above, then run `./bootstrap.sh --profile {{ profile }}` again; completed steps are skipped or no-ops, and failed `run_once` scripts are retried.
      - Use `--strict` to stop at the first failure while debugging.

- name: Save setup outcome report to file
  copy:
    content: "{{ dotfiles_setup_report_text }}"
    dest: "{{ dotfiles_setup_report_path }}"
    mode: "0644"
  changed_when: false
  ignore_errors: yes

- name: Collect failure lines for the terminal summary
  vars:
    dotfiles_failure_first_line: "{{ ((item.error | default('') | string | trim) ~ '\n').splitlines() | first | truncate(160) }}"
  set_fact:
    dotfiles_setup_summary_failure_lines: >-
      {{
        (dotfiles_setup_summary_failure_lines | default([]))
        + ['  - [' ~ item.phase ~ '] ' ~ item.name ~ (': ' ~ dotfiles_failure_first_line if dotfiles_failure_first_line | length > 0 else '')]
      }}
  loop: "{{ dotfiles_setup_failures }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Show setup outcome summary
  debug:
    msg: >-
      {{
        ['Setup result: ' ~ dotfiles_setup_result]
        + (['Failed' ~ ('' if dotfiles_setup_aborted | bool else ' and skipped') ~ ':'] if dotfiles_setup_failures | length > 0 else [])
        + (dotfiles_setup_summary_failure_lines | default([]))
        + ['Full report: ' ~ dotfiles_setup_report_path]
      }}
