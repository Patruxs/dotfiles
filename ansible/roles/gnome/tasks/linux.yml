---
- name: Load GNOME dconf data
  include_vars:
    file: "{{ chezmoi_dir }}/home/.chezmoidata/gnome_dconf.yaml"
    name: gnome_dconf_data

# Match on the process name only. A full-command-line match picks up
# unrelated daemons such as `at-spi2-registryd --use-gnome-session`, which KDE
# Plasma also runs, and would apply GNOME settings to a non-GNOME desktop.
# Process names are truncated to 15 characters, so gnome-session-binary
# appears as gnome-session-b.
- name: Check if a GNOME session is running
  command:
    argv:
      - pgrep
      - -x
      - gnome-shell|gnome-session-b.*
  register: gnome_running
  failed_when: false
  changed_when: false

- name: Apply GNOME dconf settings
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ gnome_dconf_data.gnome_dconf.entries | default([]) }}"
  when:
    - gnome_running.rc == 0

- name: Restore GNOME Shell extensions
  include_tasks: extensions.yml
  when:
    - gnome_running.rc == 0
