---
- name: Check current login shell (Linux)
  ansible.builtin.command: getent passwd {{ ansible_facts['user_id'] | quote }}
  register: shell_passwd_entry
  changed_when: false
  failed_when: false

- name: Set bash as default shell (Linux)
  ansible.builtin.shell: |
    set -euo pipefail

    if [ -n {{ dotfiles_sudo_password_file | quote }} ]; then
      sudo -S -p '' chsh -s /bin/bash {{ ansible_facts['user_id'] | quote }} < {{ dotfiles_sudo_password_file | quote }}
    else
      sudo -n chsh -s /bin/bash {{ ansible_facts['user_id'] | quote }}
    fi
  args:
    executable: /bin/bash
  when:
    - shell_passwd_entry.rc == 0
    - not shell_passwd_entry.stdout.endswith('/bin/bash')
  ignore_errors: yes
