---
platform: arch
package_family: pacman

package_sets:
  audio_auto_switch:
    pacman:
      - jq
      - pipewire
      - wireplumber
  core_cli:
    pacman:
      - git
      - curl
      - wget
      - unzip
      - bash
      - neovim
      - tmux
      - btop
      - ripgrep
      - fzf
      - jq
      - github-cli
  desktop_base:
    pacman:
      - flatpak
      - gparted
      - rofi
      - python-psutil
    flatpak:
      - com.gitbutler.gitbutler
      - com.visualstudio.code
      - md.obsidian.Obsidian
      - org.localsend.localsend_app
  desktop_apps:
    pacman:
      - nvtop
    flatpak:
      - org.telegram.desktop
      - us.zoom.Zoom
      - com.spotify.Client
      - com.getpostman.Postman
      - org.onlyoffice.desktopeditors
      - com.obsproject.Studio
      - com.microsoft.Edge
      - net.ankiweb.Anki
      - com.termius.Termius
      - io.github.kolunmi.Bazaar
  devtools:
    pacman:
      - nodejs
      - npm
      - python
      - python-pip
      - gcc
      - go
  docker_engine:
    pacman:
      - docker
  jetbrains_mono_nerd_font:
    pacman:
      - ttf-jetbrains-mono-nerd
  mise:
    pacman:
      - mise
  terminal_toys:
    pacman:
      - cmatrix
  webserver_nginx:
    pacman:
      - nginx
