---
platform: arch
package_family: pacman

package_sets:
  audio_auto_switch:
    pacman:
      - jq
      - pipewire
      - wireplumber
  core_cli:
    pacman:
      - git
      - curl
      - wget
      - unzip
      - bash
      - neovim
      - tmux
      - btop
      - ripgrep
      - fzf
      - jq
      - github-cli
  desktop_base:
    pacman:
      - flatpak
      - gparted
      - rofi
      - python-psutil
      - obsidian
    flatpak:
      - com.gitbutler.gitbutler
      - com.visualstudio.code
      - org.localsend.localsend_app
      - it.mijorus.gearlever
  desktop_apps:
    pacman:
      - nvtop
      - telegram-desktop
      - discord
      - obs-studio
      - anki
      - bazaar
      - signal-desktop
    flatpak:
      - com.spotify.Client
      - org.onlyoffice.desktopeditors
      - com.microsoft.Edge
      - com.termius.Termius
  devtools:
    pacman:
      - nodejs
      - npm
      - python
      - python-pip
      - gcc
      - go
  docker_engine:
    pacman:
      - docker
  jetbrains_mono_nerd_font:
    pacman:
      - ttf-jetbrains-mono-nerd
  mise:
    pacman:
      - mise
  terminal_toys:
    pacman:
      - cmatrix
  webserver_nginx:
    pacman:
      - nginx
