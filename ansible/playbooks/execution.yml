---
- name: Prepare low-memory Linux setup (strict)
  when:
    - dotfiles_setup_mode == 'strict'
    - dotfiles_low_memory_setup | default(false) | bool
    - dotfiles_platform.system == 'Linux'
  block:
    - name: Run the low_memory role
      ansible.builtin.include_role:
        name: low_memory

    - name: Record low-memory setup completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'low_memory',
                'name': 'swap and installer throttling',
                'detail': dotfiles_low_memory_summary | default('Low-memory setup was enabled for this machine.')
              }
            ]
          }}

- name: Prepare low-memory Linux setup (best effort)
  when:
    - dotfiles_setup_mode == 'best_effort'
    - dotfiles_low_memory_setup | default(false) | bool
    - dotfiles_platform.system == 'Linux'
  block:
    - name: Run the low_memory role
      ansible.builtin.include_role:
        name: low_memory

    - name: Record low-memory setup completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'low_memory',
                'name': 'swap and installer throttling',
                'detail': dotfiles_low_memory_summary | default('Low-memory setup was enabled for this machine.')
              }
            ]
          }}
  rescue:
    - name: Record low-memory setup failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            dotfiles_setup_failures + [
              {
                'phase': 'low_memory',
                'name': 'swap and installer throttling',
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg
          | default(ansible_failed_result | to_json))
              }
            ]
          }}

- name: Generate Chezmoi setup data
  include_role:
    name: chezmoi_setup_data

- name: Record Chezmoi setup data generation
  set_fact:
    dotfiles_setup_configured: >-
      {{
        dotfiles_setup_configured + [
          {
            'phase': 'chezmoi',
            'name': 'setup data',
            'detail': 'Selected profile, platform, and features were generated for guarded templates.'
          }
        ]
      }}

- name: Install selected package-set entries (strict)
  when: dotfiles_setup_mode == 'strict'
  block:
    - name: Run the package_installer role
      ansible.builtin.include_role:
        name: package_installer

    - name: Record package installer completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'packages',
                'name': 'direct package entries',
                'detail': 'Selected package-set entries finished through ' ~ dotfiles_platform.package_family ~ '.'
              }
            ]
          }}

- name: Install selected package-set entries (best effort)
  when: dotfiles_setup_mode == 'best_effort'
  block:
    - name: Run the package_installer role
      ansible.builtin.include_role:
        name: package_installer

    - name: Record package installer completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'packages',
                'name': 'direct package entries',
                'detail': 'Selected package-set entries finished through ' ~ dotfiles_platform.package_family ~ '.'
              }
            ]
          }}
  rescue:
    - name: Record package installation failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            dotfiles_setup_failures + [
              {
                'phase': 'packages',
                'name': 'Install selected package-set entries',
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg
          | default(ansible_failed_result | to_json))
              }
            ]
          }}

- name: Run selected feature roles
  include_tasks: feature_best_effort.yml
  loop: "{{ dotfiles_feature_execution_order }}"
  loop_control:
    loop_var: selected_feature
  when: selected_feature in (features | default([]))

- name: Apply Chezmoi
  when: dotfiles_setup_mode == 'strict'
  block:
    - name: Run the chezmoi role
      ansible.builtin.include_role:
        name: chezmoi

    - name: Record Chezmoi apply completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'chezmoi',
                'name': 'chezmoi apply',
                'detail': 'Managed dotfiles were applied from the selected source.'
              }
            ]
          }}

- name: Apply Chezmoi (best effort)
  when: dotfiles_setup_mode == 'best_effort'
  block:
    - name: Run the chezmoi role
      ansible.builtin.include_role:
        name: chezmoi

    - name: Record Chezmoi apply completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'chezmoi',
                'name': 'chezmoi apply',
                'detail': 'Managed dotfiles were applied from the selected source.'
                          ~ (
                            ' ' ~ (dotfiles_chezmoi_failed_scripts | length) ~ ' script(s) failed and were skipped; see Errors.'
                            if (dotfiles_chezmoi_failed_scripts | default([]) | length > 0)
                            else ''
                          )
              }
            ]
          }}
      when: dotfiles_chezmoi_files_applied | default(true) | bool
  rescue:
    - name: Record Chezmoi apply failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            dotfiles_setup_failures + [
              {
                'phase': 'chezmoi',
                'name': 'chezmoi apply',
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg
          | default(ansible_failed_result | to_json))
              }
            ]
          }}

- name: Install mise tool lists (strict)
  when:
    - dotfiles_setup_mode == 'strict'
    - "'mise' in (features | default([]))"
    - not (dotfiles_ci | default(false))
  block:
    - name: Run the mise_tools role
      ansible.builtin.include_role:
        name: mise_tools

    - name: Record mise tool list completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'mise',
                'name': 'mise tool lists',
                'detail': 'Tools requested in ~/.config/mise/conf.d were installed and upgraded to their latest release.'
              }
            ]
          }}

- name: Install mise tool lists (best effort)
  when:
    - dotfiles_setup_mode == 'best_effort'
    - "'mise' in (features | default([]))"
    - not (dotfiles_ci | default(false))
  block:
    - name: Run the mise_tools role
      ansible.builtin.include_role:
        name: mise_tools

    - name: Record mise tool list completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'mise',
                'name': 'mise tool lists',
                'detail': 'Tools requested in ~/.config/mise/conf.d were installed and upgraded to their latest release; tools still missing are listed under Errors.'
              }
            ]
          }}
  rescue:
    - name: Record mise tool list failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            dotfiles_setup_failures + [
              {
                'phase': 'mise',
                'name': 'Install mise tool lists',
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg
          | default(ansible_failed_result | to_json))
              }
            ]
          }}

- name: Enable selected services (strict)
  when: dotfiles_setup_mode == 'strict'
  block:
    - name: Run the services role
      ansible.builtin.include_role:
        name: services

    - name: Record service setup completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'services',
                'name': 'selected services',
                'detail': 'Selected service setup phase finished; service conditions may skip unavailable sessions.'
              }
            ]
          }}

- name: Enable selected services (best effort)
  when: dotfiles_setup_mode == 'best_effort'
  block:
    - name: Run the services role
      ansible.builtin.include_role:
        name: services

    - name: Record service setup completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'services',
                'name': 'selected services',
                'detail': 'Selected service setup phase finished; service conditions may skip unavailable sessions.'
              }
            ]
          }}
  rescue:
    - name: Record service setup failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            dotfiles_setup_failures + [
              {
                'phase': 'services',
                'name': 'Enable selected services',
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg
          | default(ansible_failed_result | to_json))
              }
            ]
          }}
