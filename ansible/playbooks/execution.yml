---
- name: Prepare low-memory Linux setup
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    phase:
      role: low_memory
      key: low_memory
      name: swap and installer throttling
      detail: "{{ dotfiles_low_memory_summary | default('Low-memory setup was enabled for this machine.') }}"
  when:
    - dotfiles_low_memory_setup | default(false) | bool
    - dotfiles_platform.system == 'Linux'
    - not (dotfiles_ci | default(false))

- name: Record low-memory setup skipped under DOTFILES_CI
  ansible.builtin.set_fact:
    dotfiles_setup_skipped: >-
      {{
        dotfiles_setup_skipped + [
          {
            'phase': 'low_memory',
            'name': 'swap and installer throttling',
            'detail': 'DOTFILES_CI is set, so no swap file was created on this machine.'
          }
        ]
      }}
  when:
    - dotfiles_low_memory_setup | default(false) | bool
    - dotfiles_platform.system == 'Linux'
    - dotfiles_ci | default(false)

- name: Generate Chezmoi setup data
  ansible.builtin.include_role:
    name: chezmoi_setup_data

- name: Record Chezmoi setup data generation
  ansible.builtin.set_fact:
    dotfiles_setup_configured: >-
      {{
        dotfiles_setup_configured + [
          {
            'phase': 'chezmoi',
            'name': 'setup data',
            'detail': 'Selected profile, platform, and features were generated for guarded templates.'
          }
        ]
      }}

- name: Install selected package-set entries
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    phase:
      role: package_installer
      key: packages
      name: direct package entries
      detail: "Selected package-set entries finished through {{ dotfiles_platform.package_family }}."

- name: Run selected feature roles
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    phase:
      role: "features/{{ selected_feature }}"
      key: feature
      name: "{{ selected_feature }}"
      detail: >-
        {{
          (dotfiles_feature_details | default({}))[selected_feature]
          | default('Selected feature role finished; platform and environment conditions may skip individual subtasks.')
        }}
  loop: "{{ dotfiles_feature_execution_order }}"
  loop_control:
    loop_var: selected_feature
  when: selected_feature in (features | default([]))

- name: Apply Chezmoi
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    phase:
      role: chezmoi
      key: chezmoi
      name: chezmoi apply
      recorded: "{{ dotfiles_chezmoi_files_applied | default(true) }}"
      detail: >-
        Managed dotfiles were applied from the selected source.{{
          ' ' ~ (dotfiles_chezmoi_failed_scripts | length) ~ ' script(s) failed and were skipped; see Errors.'
          if (dotfiles_chezmoi_failed_scripts | default([]) | length > 0)
          else ''
        }}

- name: Install mise tool lists
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    phase:
      role: mise_tools
      key: mise
      name: mise tool lists
      detail: Tools requested in ~/.config/mise/conf.d were installed and upgraded to their latest release; tools still missing are listed under Errors.
  when:
    - "'mise' in (features | default([]))"
    - not (dotfiles_ci | default(false))

- name: Enable selected services
  ansible.builtin.include_tasks: run_phase.yml
  vars:
    phase:
      role: services
      key: services
      name: selected services
      detail: Selected service setup phase finished; service conditions may skip unavailable sessions.
