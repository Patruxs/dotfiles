---
- name: Run selected feature role (strict) {{ selected_feature }}
  when: dotfiles_setup_mode == 'strict'
  block:
    - name: Run the feature role
      ansible.builtin.include_role:
        name: "features/{{ selected_feature }}"

    - name: Record selected feature completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'feature',
                'name': selected_feature,
                'detail': (dotfiles_feature_details | default({}))[selected_feature] | default('Selected feature role finished; platform and environment conditions
          may skip individual subtasks.')
              }
            ]
          }}

- name: Run selected feature role (best effort) {{ selected_feature }}
  when: dotfiles_setup_mode == 'best_effort'
  block:
    - name: Run the feature role
      ansible.builtin.include_role:
        name: "features/{{ selected_feature }}"

    - name: Record selected feature completion
      set_fact:
        dotfiles_setup_configured: >-
          {{
            dotfiles_setup_configured + [
              {
                'phase': 'feature',
                'name': selected_feature,
                'detail': (dotfiles_feature_details | default({}))[selected_feature] | default('Selected feature role finished; platform and environment conditions
          may skip individual subtasks.')
              }
            ]
          }}
  rescue:
    - name: Record selected feature failure
      set_fact:
        dotfiles_setup_failures: >-
          {{
            dotfiles_setup_failures + [
              {
                'phase': 'feature',
                'name': selected_feature,
                'task': ansible_failed_task.name | default('unknown task'),
                'error': (ansible_failed_result.stderr | default('') | string) if (ansible_failed_result.stderr | default('') | string | length > 0) else (ansible_failed_result.msg
          | default(ansible_failed_result | to_json))
              }
            ]
          }}
