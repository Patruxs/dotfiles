---
- name: Check for passwordless sudo on Linux
  command: sudo -n true
  register: dotfiles_passwordless_sudo
  changed_when: false
  failed_when: false
  when: ansible_facts["system"] == "Linux"

- name: Detect automation environment
  set_fact:
    dotfiles_automation: >-
      {{
        (dotfiles_ci | default(false) | bool)
        or ((lookup('env', 'GITHUB_ACTIONS') | default('', true) | string | lower) in ['1', 'true', 'yes'])
        or ((lookup('env', 'CI') | default('', true) | string | lower) in ['1', 'true', 'yes'])
      }}

- name: Detect setup mode
  set_fact:
    dotfiles_setup_mode: "{{ dotfiles_setup_mode | default(lookup('env', 'DOTFILES_SETUP_MODE') | default('best_effort', true), true) }}"

- name: Fail when setup mode is invalid
  fail:
    msg: "Invalid setup mode '{{ dotfiles_setup_mode }}'. Use best_effort or strict."
  when: dotfiles_setup_mode not in ['best_effort', 'strict']

- name: Detect low-memory setup mode
  vars:
    dotfiles_low_memory_env: "{{ lookup('env', 'DOTFILES_LOW_MEMORY') | default('auto', true) | string | lower }}"
  set_fact:
    dotfiles_low_memory_threshold_mb: "{{ lookup('env', 'DOTFILES_LOW_MEMORY_THRESHOLD_MB') | default('4096', true) | int }}"
    dotfiles_low_memory_setup: >-
      {{
        dotfiles_low_memory_env in ['1', 'true', 'yes', 'on']
        or (
          dotfiles_low_memory_env not in ['0', 'false', 'no', 'off']
          and dotfiles_platform.system == 'Linux'
          and (ansible_facts['memtotal_mb'] | default(0) | int) > 0
          and (ansible_facts['memtotal_mb'] | default(0) | int) <= (lookup('env', 'DOTFILES_LOW_MEMORY_THRESHOLD_MB') | default('4096', true) | int)
        )
      }}

- name: Detect CI container environment
  set_fact:
    dotfiles_container_ci: >-
      {{
        (dotfiles_automation | bool)
        and (
          (ansible_facts['virtualization_type'] | default('')) in ['container', 'containerd', 'docker', 'lxc', 'openvz', 'podman']
          or (ansible_facts['container'] | default(false) | bool)
        )
      }}

# Desktop settings follow the session, not the distro. bootstrap.sh ran the
# same script in the same environment, so both agree; a DOTFILES_DESKTOP the
# user set (--desktop) reaches it through the environment.
- name: Detect the desktop environment
  command:
    argv:
      - "{{ chezmoi_dir }}/scripts/detect-desktop.sh"
      - --explain
  register: dotfiles_desktop_probe
  changed_when: false
  when: dotfiles_platform.system == 'Linux'

- name: Record the desktop environment
  set_fact:
    dotfiles_desktop: >-
      {{
        (dotfiles_desktop_probe.stdout_lines | default(['none']) | first)
        if dotfiles_platform.system == 'Linux' else 'none'
      }}
    dotfiles_desktop_detail: >-
      {{
        (dotfiles_desktop_probe.stdout_lines | default([]))[1:] | join(' ')
        if dotfiles_platform.system == 'Linux' else 'no desktop settings on ' ~ dotfiles_platform.system
      }}

- name: Check saved profile and ask for confirmation
  pause:
    prompt: "Current profile is {{ ansible_facts['dotfiles_profile'] }}. Continue? [Y/n]"
  register: confirm_profile
  when:
    - profile is not defined
    - ansible_facts["dotfiles_profile"] is defined
    - ansible_facts["env"]["TERM"] is defined

- name: Set profile from saved fact if confirmed
  set_fact:
    profile: "{{ ansible_facts['dotfiles_profile'] }}"
  when:
    - profile is not defined
    - confirm_profile is defined
    - not confirm_profile.skipped | default(false)
    - confirm_profile.user_input | default('y') | lower in ['y', 'yes', '']

- name: Reuse saved profile in non-interactive mode
  set_fact:
    profile: "{{ ansible_facts['dotfiles_profile'] }}"
  when:
    - profile is not defined
    - ansible_facts["dotfiles_profile"] is defined
    - ansible_facts["env"]["TERM"] is not defined

- name: Prompt for profile if not provided or saved/confirmed
  pause:
    prompt: "Select profile (personal or work)"
  register: prompt_profile
  when:
    - profile is not defined
    - ansible_facts["env"]["TERM"] is defined

- name: Set profile fact from prompt
  set_fact:
    profile: "{{ prompt_profile.user_input }}"
  when: profile is not defined and prompt_profile is defined and not prompt_profile.skipped | default(false)

- name: Fail clearly when no profile is available in non-interactive mode
  fail:
    msg: "No profile was provided. Re-run bootstrap.sh and choose a profile, or pass -e profile=personal|work."
  when:
    - profile is not defined
    - ansible_facts["env"]["TERM"] is not defined

- name: Check selected profile file
  stat:
    path: "{{ chezmoi_dir }}/ansible/vars/profiles/{{ profile }}.yml"
  register: selected_profile_file

- name: Fail if selected profile is unknown
  fail:
    msg: "Unknown profile '{{ profile }}'. Expected a profile file in ansible/vars/profiles."
  when: not selected_profile_file.stat.exists

- name: Save selected profile to facts cache
  set_fact:
    dotfiles_profile: "{{ profile }}"
    cacheable: true

- name: Remove old legacy profile file if it exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.dotfiles_profile"
    state: absent

- name: Load profile vars
  include_vars:
    file: "{{ chezmoi_dir }}/ansible/vars/profiles/{{ profile }}.yml"

- name: Read the Ubuntu releases Docker's apt repository currently serves
  ansible.builtin.uri:
    url: https://download.docker.com/linux/ubuntu/dists/
    return_content: true
  register: dotfiles_docker_desktop_ubuntu_dists
  failed_when: false
  when:
    - dotfiles_platform.name == 'ubuntu'
    - "'docker_desktop' in (features | default([]))"

- name: Define Ubuntu releases supported by Docker's apt repository
  ansible.builtin.set_fact:
    dotfiles_docker_desktop_ubuntu_codenames: >-
      {{
        (dotfiles_docker_desktop_ubuntu_dists.content | default('') | regex_findall('href="([a-z]+)/"'))
        if (dotfiles_docker_desktop_ubuntu_dists.status | default(0)) == 200
        else [dotfiles_platform.ubuntu_codename]
      }}

- name: Read the Fedora releases Docker's rpm repository currently serves
  ansible.builtin.uri:
    url: https://download.docker.com/linux/fedora/
    return_content: true
  register: dotfiles_docker_desktop_fedora_index
  failed_when: false
  when:
    - dotfiles_platform.name == 'fedora'
    - "'docker_desktop' in (features | default([]))"

- name: Define Fedora releases supported by Docker Desktop
  vars:
    docker_fedora_releases: >-
      {{
        dotfiles_docker_desktop_fedora_index.content | default('')
        | regex_findall('href="([0-9]+)/"') | map('int') | sort | list
      }}
  ansible.builtin.set_fact:
    dotfiles_docker_desktop_fedora_releases: >-
      {{
        docker_fedora_releases[-2:]
        if (dotfiles_docker_desktop_fedora_index.status | default(0)) == 200 and docker_fedora_releases | length > 0
        else [dotfiles_platform.distribution_major_version | int]
      }}

- name: Initialize best-effort setup failure summary
  set_fact:
    dotfiles_setup_failures: []
    dotfiles_setup_configured: []
    dotfiles_setup_skipped: []
    dotfiles_setup_aborted: false

- name: Execute setup tasks
  block:
    - name: Validate selected profile, platform, and features
      include_role:
        name: profile_preflight

    - name: Run the execution sequence
      ansible.builtin.include_tasks: execution.yml
  rescue:
    - name: Record the failure that aborted setup
      ansible.builtin.include_role:
        name: record_failure
      vars:
        failure_phase: aborted
        failure_name: "{{ ansible_failed_task.name | default('unknown task', true) }}"
        failure_is_fatal: true
  always:
    - name: Show setup outcome summary
      include_role:
        name: setup_outcome

- name: Stop after an aborted setup
  fail:
    msg: "Setup aborted at '{{ (dotfiles_setup_failures | last).name }}'. See {{ lookup('env', 'HOME') }}/.dotfiles_setup_report.md for details."
  when: dotfiles_setup_aborted | bool
