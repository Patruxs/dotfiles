---
- name: Ubuntu setup
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    chezmoi_dir: "{{ lookup('env', 'DOTFILES_CHEZMOI_DIR') | default(lookup('env', 'HOME') ~ '/.local/share/chezmoi', true) }}"
    dotfiles_ci: "{{ (lookup('env', 'DOTFILES_CI') | default('', true) | string | lower) in ['1', 'true', 'yes'] }}"
    dotfiles_sudo_password_file: "{{ lookup('env', 'DOTFILES_SUDO_PASSWORD_FILE') | default('', true) }}"
    dotfiles_platform:
      name: ubuntu
      package_family: apt
      system: Linux
      os_family: Debian
      distribution: "{{ ansible_facts['distribution'] | default('') }}"
      distribution_version: "{{ ansible_facts['distribution_version'] | default('') }}"
      distribution_major_version: "{{ ansible_facts['distribution_major_version'] | default('') }}"
      architecture: "{{ ansible_facts['architecture'] | default('') }}"
      distro_key: debian
      ubuntu_codename: "{{ ansible_facts['distribution_release'] | default('') }}"
      package_index_refresh_command: [apt-get, update]
      package_install_command: [env, DEBIAN_FRONTEND=noninteractive, apt-get, -o, 'Dpkg::Options::=--force-confdef', -o, 'Dpkg::Options::=--force-confold', install, -y]
      package_install_serial_command: [env, DEBIAN_FRONTEND=noninteractive, apt-get, -o, Acquire::Queue-Mode=access, -o, 'Acquire::http::Pipeline-Depth=0', -o, 'Acquire::Retries=3', -o, 'Dpkg::Options::=--force-confdef', -o, 'Dpkg::Options::=--force-confold', install, -y]
      package_install_noop_marker: "0 upgraded, 0 newly installed"

  pre_tasks:
    - name: Load Ubuntu package set
      include_vars:
        file: "{{ chezmoi_dir }}/ansible/vars/package_sets/ubuntu.yml"
        name: platform_package_data

  tasks:
    - name: Run the shared setup tasks
      ansible.builtin.import_tasks: common.yml
