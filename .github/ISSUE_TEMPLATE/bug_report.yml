name: Bug report
description: Report a reproducible problem with the bootstrap or managed configuration
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove secrets and private machine data from all logs.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Ubuntu
        - Fedora (or a Fedora rebuild such as Nobara)
        - Arch Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - personal
        - work
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized logs. Do not include credentials or private machine data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private machine data from this report.
          required: true
