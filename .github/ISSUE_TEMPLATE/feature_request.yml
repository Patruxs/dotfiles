name: Feature request
description: Suggest an improvement to the project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.
  - type: dropdown
    id: platforms
    attributes:
      label: Scope
      options:
        - All platforms
        - Linux
        - macOS
        - Windows
        - Documentation only
    validations:
      required: true
