---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
  - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Test harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - name: Install shellcheck, Ansible, yamllint and ansible-lint
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck ansible pipx
        pipx install yamllint
        pipx install ansible-lint
    - name: Install chezmoi
      run: |
        mkdir -p "$HOME/.local/bin"
        sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
    - name: Run test harness
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        ./test/test_harness.sh

  ubuntu-latest:
    name: Ubuntu (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v5

    - name: Run Bootstrap
      run: ./bootstrap.sh --profile ${{ matrix.profile }} --strict
    - name: Check Setup Report
      run: ./test/ci_setup_report_check.sh
    - name: Check Idempotency
      run: |
        set -o pipefail
        export PATH="$HOME/.local/bin:$PATH"
        output_log="$(mktemp)"
        chezmoi_diff="$(mktemp)"
        ./bootstrap.sh --profile ${{ matrix.profile }} --strict | tee "$output_log"
        if grep -qE "changed=[1-9]" "$output_log"; then
          echo "Idempotency test failed, changes were made on the second run"
          exit 1
        fi
        chezmoi diff --source "$PWD" > "$chezmoi_diff"
        if [ -s "$chezmoi_diff" ]; then
          cat "$chezmoi_diff"
          echo "Idempotency test failed, chezmoi diff reported changes after the second run"
          exit 1
        fi
    - name: Check Setup Report After Second Run
      run: ./test/ci_setup_report_check.sh

  macos-latest:
    name: macOS (${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
    - uses: actions/checkout@v5
    - name: Run Bootstrap
      run: ./bootstrap.sh --profile ${{ matrix.profile }} --strict
    - name: Check Setup Report
      run: ./test/ci_setup_report_check.sh
    - name: Check Idempotency
      run: |
        set -o pipefail
        export PATH="$HOME/.local/bin:$PATH"
        output_log="$(mktemp)"
        chezmoi_diff="$(mktemp)"
        ./bootstrap.sh --profile ${{ matrix.profile }} --strict | tee "$output_log"
        if grep -qE "changed=[1-9]" "$output_log"; then
          echo "Idempotency test failed, changes were made on the second run"
          exit 1
        fi
        chezmoi diff --source "$PWD" > "$chezmoi_diff"
        if [ -s "$chezmoi_diff" ]; then
          cat "$chezmoi_diff"
          echo "Idempotency test failed, chezmoi diff reported changes after the second run"
          exit 1
        fi
    - name: Check Setup Report After Second Run
      run: ./test/ci_setup_report_check.sh

  windows-latest:
    name: Windows (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v5
      with:
        set-safe-directory: false
    - name: Run Bootstrap
      run: .\bootstrap.ps1 -ProfileName ${{ matrix.profile }} -SetupMode strict
    - name: Check Setup Report
      shell: pwsh
      run: |
        $report = Join-Path $HOME ".dotfiles_setup_report.md"
        if (-not (Test-Path $report)) {
          throw "Setup report not found at $report."
        }
        if (-not (Select-String -Path $report -SimpleMatch -Pattern "- Result: Completed successfully." -Quiet)) {
          Get-Content $report | Write-Host
          throw "Setup report does not say the run completed successfully."
        }
    - name: Check Idempotency
      shell: pwsh
      run: |
        .\bootstrap.ps1 -ProfileName ${{ matrix.profile }} -SetupMode strict
        $diff = chezmoi diff --source "$PWD"
        if ($LASTEXITCODE -ne 0) {
          throw "chezmoi diff failed with exit code $LASTEXITCODE."
        }
        if (-not [string]::IsNullOrWhiteSpace($diff)) {
          $diff | Write-Host
          throw "Idempotency test failed, chezmoi diff reported changes after the second run."
        }
    - name: Check Setup Report After Second Run
      shell: pwsh
      run: |
        $report = Join-Path $HOME ".dotfiles_setup_report.md"
        if (-not (Test-Path $report)) {
          throw "Setup report not found at $report."
        }
        if (-not (Select-String -Path $report -SimpleMatch -Pattern "- Result: Completed successfully." -Quiet)) {
          Get-Content $report | Write-Host
          throw "Setup report does not say the run completed successfully."
        }
    - name: Run CI Bootstrap Regression Checks
      shell: bash
      run: ./test/ci_bootstrap_regressions.sh

  fedora-latest:
    name: Fedora (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    container:
      image: fedora:latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Install dependencies
      run: dnf install -y git sudo curl
    - uses: actions/checkout@v5
    - name: Run Bootstrap (Fedora)
      run: ./bootstrap.sh --profile ${{ matrix.profile }} --strict
    - name: Check Setup Report
      run: ./test/ci_setup_report_check.sh
    - name: Check Idempotency (Fedora)
      run: |
        set -o pipefail
        export PATH="$HOME/.local/bin:$PATH"
        output_log="$(mktemp)"
        chezmoi_diff="$(mktemp)"
        ./bootstrap.sh --profile ${{ matrix.profile }} --strict | tee "$output_log"
        if grep -qE "changed=[1-9]" "$output_log"; then
          echo "Idempotency test failed, changes were made on the second run"
          exit 1
        fi
        chezmoi diff --source "$PWD" > "$chezmoi_diff"
        if [ -s "$chezmoi_diff" ]; then
          cat "$chezmoi_diff"
          echo "Idempotency test failed, chezmoi diff reported changes after the second run"
          exit 1
        fi
    - name: Check Setup Report After Second Run
      run: ./test/ci_setup_report_check.sh

  arch-latest:
    name: Arch (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    container:
      image: archlinux:latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Install dependencies
      run: pacman -Syu --noconfirm git sudo curl
    - uses: actions/checkout@v5
    - name: Run Bootstrap (Arch)
      run: ./bootstrap.sh --profile ${{ matrix.profile }} --strict
    - name: Check Setup Report
      run: ./test/ci_setup_report_check.sh
    - name: Check Idempotency (Arch)
      run: |
        set -o pipefail
        export PATH="$HOME/.local/bin:$PATH"
        output_log="$(mktemp)"
        chezmoi_diff="$(mktemp)"
        ./bootstrap.sh --profile ${{ matrix.profile }} --strict | tee "$output_log"
        if grep -qE "changed=[1-9]" "$output_log"; then
          echo "Idempotency test failed, changes were made on the second run"
          exit 1
        fi
        chezmoi diff --source "$PWD" > "$chezmoi_diff"
        if [ -s "$chezmoi_diff" ]; then
          cat "$chezmoi_diff"
          echo "Idempotency test failed, chezmoi diff reported changes after the second run"
          exit 1
        fi
    - name: Check Setup Report After Second Run
      run: ./test/ci_setup_report_check.sh
