---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
  - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Test harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - name: Install shellcheck, Ansible, yamllint and ansible-lint
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck ansible pipx
        while IFS= read -r requirement; do
          pipx install "$requirement"
        done < test/requirements-lint.txt
    - name: Install chezmoi
      run: |
        mkdir -p "$HOME/.local/bin"
        sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
    - name: Run test harness
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        ./test/test_harness.sh

  unix:
    name: ${{ matrix.label }} (${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, macos, fedora, arch]
        profile: [personal, work]
        include:
        - platform: ubuntu
          label: Ubuntu
          runner: ubuntu-latest
        - platform: macos
          label: macOS
          runner: macos-latest
        - platform: fedora
          label: Fedora
          runner: ubuntu-latest
          container: fedora:latest
          prepare: dnf install -y git sudo curl
        - platform: arch
          label: Arch
          runner: ubuntu-latest
          container: archlinux:latest
          prepare: pacman -Syu --noconfirm git sudo curl
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
    - name: Install dependencies
      if: matrix.prepare
      run: ${{ matrix.prepare }}
    - uses: actions/checkout@v5
    - name: Run Bootstrap
      run: ./bootstrap.sh --profile ${{ matrix.profile }} --strict
    - name: Check Setup Report
      run: ./test/ci_setup_report_check.sh
    - name: Check Idempotency
      run: ./test/ci_idempotency_check.sh ${{ matrix.profile }}

  windows-latest:
    name: Windows (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, work]
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v5
      with:
        set-safe-directory: false
    - name: Run Bootstrap Under Windows PowerShell 5.1
      shell: powershell
      run: |
        .\bootstrap.ps1 -ProfileName ${{ matrix.profile }} -SetupMode strict
        if (-not (Test-Path (Join-Path $HOME ".config\mise\conf.d\core_cli.toml"))) {
          throw "bootstrap.ps1 did not pass the profile's features to chezmoi: ~/.config/mise/conf.d/core_cli.toml was not applied."
        }
    - name: Check Setup Report
      shell: pwsh
      run: |
        $report = Join-Path $HOME ".dotfiles_setup_report.md"
        if (-not (Test-Path $report)) {
          throw "Setup report not found at $report."
        }
        if (-not (Select-String -Path $report -SimpleMatch -Pattern "- Result: Completed successfully." -Quiet)) {
          Get-Content $report | Write-Host
          throw "Setup report does not say the run completed successfully."
        }
    - name: Check Idempotency
      shell: pwsh
      run: |
        .\bootstrap.ps1 -ProfileName ${{ matrix.profile }} -SetupMode strict
        $diff = chezmoi diff --source "$PWD"
        if ($LASTEXITCODE -ne 0) {
          throw "chezmoi diff failed with exit code $LASTEXITCODE."
        }
        if (-not [string]::IsNullOrWhiteSpace($diff)) {
          $diff | Write-Host
          throw "Idempotency test failed, chezmoi diff reported changes after the second run."
        }
    - name: Check Setup Report After Second Run
      shell: pwsh
      run: |
        $report = Join-Path $HOME ".dotfiles_setup_report.md"
        if (-not (Test-Path $report)) {
          throw "Setup report not found at $report."
        }
        if (-not (Select-String -Path $report -SimpleMatch -Pattern "- Result: Completed successfully." -Quiet)) {
          Get-Content $report | Write-Host
          throw "Setup report does not say the run completed successfully."
        }
    - name: Run CI Bootstrap Regression Checks
      shell: bash
      run: ./test/ci_bootstrap_regressions.sh
